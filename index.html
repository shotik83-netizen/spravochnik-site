<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Справочник БиФК</title>
    <meta name="description" content="Справочник документов и ссылок БиФК">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23008c95%27/%3E%3Cpath d=%27M8 8h16v16H8zM12 12h8M12 16h8M12 20h5%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 100%);
            color: #1a2c3e; 
            line-height: 1.5; 
            min-height: 100vh;
        }
        
        .app-container { max-width: 1400px; margin: 0 auto; padding: 24px 32px; }
        
        .header-premium {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 20px 32px;
            margin-bottom: 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,140,149,0.15);
        }
        
        .logo-area { display: flex; align-items: center; gap: 16px; }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #006D74, #008C95);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 8px 16px rgba(0,140,149,0.2);
        }
        .brand-text h1 { 
            font-size: 1.8rem; font-weight: 800; 
            background: linear-gradient(135deg, #006D74, #00A0AA);
            background-clip: text; -webkit-background-clip: text; color: transparent;
        }
        .brand-text p { font-size: 0.8rem; color: #6c86a3; font-weight: 500; }
        
        .search-premium { flex: 1; min-width: 280px; max-width: 380px; position: relative; }
        .search-premium i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .search-input-premium {
            width: 100%; padding: 14px 18px 14px 48px;
            border: 1px solid #e2e8f0; border-radius: 60px;
            font-family: 'Inter', sans-serif; font-size: 0.9rem;
            background: #f8fafc; transition: all 0.2s;
        }
        .search-input-premium:focus { outline: none; border-color: #008C95; background: white; box-shadow: 0 0 0 3px rgba(0,140,149,0.1); }
        
        .refresh-premium {
            background: #008C95; color: white; border: none; border-radius: 60px;
            padding: 12px 24px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            font-weight: 600; transition: all 0.2s;
        }
        .refresh-premium:hover { background: #006D74; transform: translateY(-2px); }
        .refresh-premium:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .live-panel { width: 100%; margin: -8px 0 20px; }
        .live-heading { position: relative; display: flex; align-items: center; justify-content: flex-start; gap: 12px; margin-bottom: 7px; text-align: left; }
        .live-heading h2 { font-size: .94rem; color: #006D74; }
        .live-update { position: absolute; right: 0; color: #64748b; font-size: .69rem; white-space: nowrap; }
        .live-scroll { overflow-x: auto; }
        .live-grid { display: grid; grid-template-columns: minmax(300px, 1.2fr) minmax(210px, .85fr) minmax(280px, 1fr); min-width: 790px; background: #fff; border: 1px solid #D6E9EA; border-radius: 12px; overflow: hidden; }
        .live-card { padding: 9px 14px; min-width: 0; min-height: 87px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .live-card + .live-card { border-left: 1px solid #E0EDEE; }
        .live-card-top { display: flex; gap: 6px; align-items: center; justify-content: center; color: #64748b; font-size: .7rem; font-weight: 700; margin-bottom: 5px; }
        .live-card-top i { color: #008C95; }
        .live-card-top a { color: inherit; text-decoration: none; }
        .live-card-top a:hover { text-decoration: underline; }
        .live-row { display: flex; align-items: center; gap: 8px; }
        .live-currencies { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
        .live-quote { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 0 7px; color: #17494D; text-decoration: none; white-space: nowrap; font-size: .94rem; font-weight: 750; font-variant-numeric: tabular-nums; }
        .live-quote:first-child { padding-left: 0; }
        .live-quote + .live-quote { border-left: 1px solid #E0EDEE; }
        .live-quote:hover, .live-rate-link:hover { color: #00757D; text-decoration: underline; }
        .live-quote small { color: #697d88; font-size: .65rem; font-weight: 700; }
        .live-rate-link { display: inline-block; color: #17494D; font-size: 1.12rem; font-weight: 800; text-decoration: none; line-height: 1.4; font-variant-numeric: tabular-nums; }
        .live-detail { color: #718293; font-size: .67rem; line-height: 1.25; }
        .live-weather-widgets { display: flex; gap: 8px; align-items: flex-start; }
        .live-weather-place { width: 120px; flex: 0 0 120px; }
        .live-weather-place img { display: block; width: 120px; height: 60px; border-radius: 6px; filter: saturate(.68); }
        .live-quote.live-stale, .live-rate-link.live-stale { color: #9b4b31; }
        .search-results { display: grid; gap: 10px; margin-top: 16px; }
        .search-result { width: 100%; text-align: left; display: grid; gap: 4px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px 18px; cursor: pointer; color: #243849; font: inherit; }
        .search-result:hover, .search-result:focus-visible { border-color: #008C95; background: #F0F9FA; }
        .search-result small { color: #006D74; }
        .search-result span { color: #64748b; font-size: .82rem; }
        
        .dashboard-premium { display: grid; grid-template-columns: 300px 1fr; gap: 32px; }
        
        .sidebar-premium {
            background: white; border-radius: 32px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.08);
            overflow: hidden; border: 1px solid rgba(0,0,0,0.05);
            position: sticky; top: 24px; height: fit-content;
        }
        .sidebar-header {
            padding: 24px 24px 16px; border-bottom: 1px solid #edf2f7;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .sidebar-header h2 { font-size: 1rem; font-weight: 700; color: #006D74; text-transform: uppercase; letter-spacing: 1px; }
        
        .add-section-btn {
            background: #e2e8f0; border-radius: 40px; padding: 6px 14px; font-size: 0.75rem;
            font-weight: 600; border: 1px dashed #94a3b8; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px; color: #334155;
        }
        .add-section-btn:hover { background: #cbd5e1; transform: translateY(-1px); }
        .add-section-btn.hidden { display: none; }
        
        .nav-premium { list-style: none; padding: 8px 12px; }
        .nav-premium li { margin-bottom: 4px; position: relative; }
        .nav-premium a {
            display: flex; align-items: center; gap: 14px; padding: 14px 18px;
            border-radius: 20px; text-decoration: none; font-weight: 600; font-size: 0.9rem;
            color: #4a5b6e; transition: all 0.25s; cursor: pointer;
        }
        .nav-premium a i { width: 24px; font-size: 1.2rem; color: #8ba0bc; }
        .nav-premium a:hover { background: #F0F9FA; color: #006D74; transform: translateX(4px); }
        .nav-premium a.active { background: linear-gradient(95deg, #E5F4F5, #ffffff); color: #006D74; border-left: 3px solid #008C95; }
        .nav-premium a.active i { color: #008C95; }
        
        .menu-actions {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            display: none; gap: 3px; background: white; padding: 4px 6px;
            border-radius: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .nav-premium li:hover .menu-actions { display: flex; }
        .menu-actions button {
            background: none; border: none; cursor: pointer; padding: 5px 10px;
            border-radius: 20px; font-size: 0.7rem; transition: all 0.2s; font-weight: 600;
        }
        .edit-menu-btn { color: #3b82f6; background: #eff6ff; }
        .edit-menu-btn:hover { background: #dbeafe; transform: scale(1.02); }
        .delete-menu-btn { color: #ef4444; background: #fef2f2; }
        .delete-menu-btn:hover { background: #fee2e2; transform: scale(1.02); }
        
        .content-premium {
            background: white; border-radius: 32px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.08);
            padding: 32px 36px; border: 1px solid rgba(0,0,0,0.05); min-height: 600px;
        }
        
        .quick-links-premium { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 2px solid #eff3f8; }
        
        .pill-premium {
            background: #f8fafc; border-radius: 60px; padding: 10px 24px; font-size: 0.85rem;
            font-weight: 600; color: #2c3e50; text-decoration: none; display: inline-flex;
            align-items: center; gap: 10px; border: 1px solid #e2e8f0; transition: all 0.2s; cursor: pointer;
        }
        .pill-premium i { font-size: 0.9rem; color: #8ba0bc; }
        .pill-premium:hover, .pill-premium.active { background: #008C95; border-color: #008C95; color: white; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,140,149,0.25); }
        .pill-premium:hover i, .pill-premium.active i { color: white; }
        
        .add-subsection-btn {
            background: #e2e8f0; border-radius: 60px; padding: 10px 20px; font-size: 0.85rem;
            font-weight: 600; border: 1px dashed #94a3b8; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 8px; color: #334155;
        }
        .add-subsection-btn:hover { background: #cbd5e1; transform: translateY(-2px); }
        .add-subsection-btn.hidden { display: none; }
        
        .table-premium { width: 100%; border-collapse: collapse; }
        .table-premium th {
            text-align: left; padding: 16px 20px; background: #fafcff;
            font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: #5b6e8c; border-bottom: 2px solid #eef2f8;
        }
        .table-premium td { padding: 14px 20px; border-bottom: 1px solid #f0f4fa; vertical-align: middle; font-size: 0.9rem; }
        .table-premium tr:hover td { background: #fafefe; }
        
        .link-wrapper { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .link-wrapper a { 
            text-decoration: none; color: #006D74; font-weight: 600; 
            display: inline-flex; align-items: center; gap: 8px;
        }
        .link-wrapper a:hover { text-decoration: underline; }
        
        .copy-link-btn {
            background: none; border: none; cursor: pointer; padding: 6px 10px;
            border-radius: 8px; transition: all 0.2s; color: #8ba0bc; font-size: 0.8rem;
        }
        .copy-link-btn:hover { background: #E5F4F5; color: #008C95; transform: scale(1.02); }
        
        .badge-premium {
            display: inline-block; padding: 6px 14px; border-radius: 60px;
            font-size: 0.7rem; font-weight: 700; background: #E5F4F5; color: #006D74;
        }
        .badge-premium.Остановлено { background: #fee2e2; color: #dc2626; }
        .badge-premium.Отсутствует { background: #fef3c7; color: #d97706; }
        
        .edit-mode-row { background-color: #fffbeb !important; transition: background-color 0.2s; }
        .edit-mode-row:hover { background-color: #fef3c7 !important; }
        
        .edit-input {
            width: 100%; min-width: 160px; padding: 10px 12px;
            border: 2px solid #fbbf24; border-radius: 12px;
            font-family: 'Inter', sans-serif; font-size: 0.85rem;
            background: #fffbeb; transition: all 0.2s;
        }
        .edit-input:focus { outline: none; border-color: #f59e0b; background: #ffffff; box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }
        
        .edit-select {
            width: 100%; min-width: 130px; padding: 10px 12px;
            border: 2px solid #fbbf24; border-radius: 12px;
            font-family: 'Inter', sans-serif; font-size: 0.85rem;
            background: #fffbeb; cursor: pointer; transition: all 0.2s;
        }
        .edit-select:focus { outline: none; border-color: #f59e0b; background: #ffffff; }
        
        .row-actions { display: flex; gap: 6px; flex-wrap: nowrap; white-space: nowrap; }
        .row-action-icon {
            background: none; border: none; cursor: pointer; padding: 8px 14px;
            border-radius: 10px; transition: all 0.2s; font-size: 0.85rem;
            font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
        }
        .row-action-icon.up { color: #3b82f6; background: #eff6ff; }
        .row-action-icon.up:hover { background: #dbeafe; transform: scale(1.02); }
        .row-action-icon.down { color: #3b82f6; background: #eff6ff; }
        .row-action-icon.down:hover { background: #dbeafe; transform: scale(1.02); }
        .row-action-icon.delete { color: #ef4444; background: #fef2f2; }
        .row-action-icon.delete:hover { background: #fee2e2; transform: scale(1.02); }
        
        .add-row-btn {
            width: 100%; background: linear-gradient(135deg, #008C95, #00A0AA);
            color: white; border: none; padding: 12px; border-radius: 14px;
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .add-row-btn:hover { background: linear-gradient(135deg, #006D74, #00757D); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,140,149,0.3); }
        
        .subsection-actions { display: flex; gap: 6px; float: right; }
        .subsection-action-btn {
            background: none; border: none; cursor: pointer; padding: 6px 14px;
            border-radius: 20px; font-size: 0.75rem; font-weight: 600; transition: all 0.2s;
        }
        .subsection-action-btn.edit { background: #3b82f6; color: white; }
        .subsection-action-btn.edit:hover { background: #2563eb; transform: scale(1.02); }
        .subsection-action-btn.delete { background: #ef4444; color: white; }
        .subsection-action-btn.delete:hover { background: #dc2626; transform: scale(1.02); }
        
        .footer-premium { margin-top: 48px; text-align: center; font-size: 0.75rem; color: #8ba0bc; padding: 28px; border-top: 1px solid #eef2f8; }
        
        .edit-trigger {
            position: fixed; bottom: 32px; right: 32px;
            background: #1e293b; color: white; border: none; border-radius: 60px;
            padding: 14px 28px; cursor: pointer; display: flex; align-items: center; gap: 12px;
            font-weight: 700; font-size: 0.9rem; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: all 0.2s; z-index: 100;
        }
        .edit-trigger:hover { transform: translateY(-2px); background: #008C95; }
        .edit-trigger.edit-active { background: #f59e0b; color: #1e293b; }
        
        .edit-panel {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1e293b; padding: 16px 32px; display: flex; justify-content: center; gap: 16px;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 99; box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
        }
        .edit-panel.active { transform: translateY(0); }
        .edit-panel button { padding: 12px 32px; border-radius: 60px; font-weight: 700; cursor: pointer; border: none; font-size: 0.9rem; transition: all 0.2s; }
        .btn-save-premium { background: #008C95; color: white; }
        .btn-save-premium:hover { background: #006D74; transform: scale(1.02); }
        .btn-cancel-premium { background: #ef4444; color: white; }
        .btn-cancel-premium:hover { background: #dc2626; transform: scale(1.02); }
        
        .modal-premium {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-premium.active { display: flex; }
        .modal-content-premium {
            background: white; border-radius: 32px; padding: 32px;
            max-width: 500px; width: 90%; box-shadow: 0 40px 60px rgba(0,0,0,0.2);
        }
        .modal-content-premium h3 { margin-bottom: 24px; color: #006D74; font-size: 1.5rem; }
        .modal-content-premium input, .modal-content-premium .custom-select {
            width: 100%; margin-bottom: 20px;
        }
        .modal-content-premium input {
            padding: 12px 16px;
            border: 1px solid #e2e8f0; border-radius: 16px;
            font-family: 'Inter', sans-serif; font-size: 0.9rem;
        }
        
        .icon-select-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
        .icon-preview { font-size: 1.5rem; width: 50px; text-align: center; padding: 10px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
        
        /* Кастомный выпадающий список с иконками */
        .custom-select {
            position: relative;
            width: 100%;
            cursor: pointer;
        }
        .select-trigger {
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: white;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .select-trigger i { width: 24px; font-size: 1.1rem; color: #008C95; }
        .select-trigger .arrow { margin-left: auto; transition: transform 0.2s; color: #94a3b8; }
        .custom-select.open .select-trigger { border-color: #008C95; box-shadow: 0 0 0 2px rgba(0,140,149,0.1); }
        .custom-select.open .select-trigger .arrow { transform: rotate(180deg); }
        .select-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            z-index: 100;
            max-height: 280px;
            overflow-y: auto;
            display: none;
        }
        .custom-select.open .select-dropdown { display: block; }
        .select-option {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 0.9rem;
        }
        .select-option i { width: 24px; font-size: 1rem; color: #5b6e8c; }
        .select-option:hover { background: #F0F9FA; }
        .select-option.selected { background: #E5F4F5; color: #006D74; font-weight: 500; }
        .select-option.selected i { color: #008C95; }
        
        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 12px 24px; border-radius: 60px;
            font-size: 0.85rem; z-index: 200; animation: fadeOut 2.5s ease forwards; pointer-events: none;
        }
        .toast.error { background: #dc2626; }
        @keyframes fadeOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        
        .scroll-top {
            position: fixed; bottom: 100px; right: 32px; background: white;
            width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1); cursor: pointer; opacity: 0; visibility: hidden;
            transition: 0.2s; border: 1px solid #e2e8f0; color: #008C95; z-index: 99;
        }
        .scroll-top.show { opacity: 1; visibility: visible; }
        
        .mobile-toggle {
            display: none; background: white; border: 1px solid #e2e8f0; border-radius: 60px;
            padding: 12px 20px; font-weight: 600; margin-bottom: 20px; width: fit-content; cursor: pointer;
        }
        
        .loading { text-align: center; padding: 60px; color: #8ba0bc; }
        .info-message { text-align: center; padding: 60px; background: #f8fafc; border-radius: 24px; color: #5b6e8c; }
        .info-message .refresh-premium { margin: 16px auto 0; }
        .sidebar-premium .info-message { padding: 18px 10px; background: transparent; }
        
        @media (max-width: 900px) {
            .app-container { padding: 16px; }
            .live-heading { flex-direction: column; align-items: flex-start; gap: 2px; }
            .live-update { position: static; }
            .dashboard-premium { grid-template-columns: 1fr; }
            .sidebar-premium { position: static; display: none; }
            .sidebar-premium.mobile-open { display: block; margin-bottom: 20px; }
            .content-premium { padding: 20px; }
            .mobile-toggle { display: flex; align-items: center; gap: 10px; }
            .scroll-top { bottom: 100px; right: 16px; }
        }
        @media (max-width: 540px) {
            .header-premium { padding: 18px; }
            .search-premium { min-width: 0; max-width: none; width: 100%; }
        }
        
        .content-section { display: none; animation: fadeSlide 0.25s ease-out; }
        .content-section.active { display: block; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .hidden { display: none !important; }
        .clearfix::after { content: ""; clear: both; display: table; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-premium">
        <div class="logo-area">

<script>
    // ========== КОНФИГУРАЦИЯ ==========
    const DATA_PATH = './bifk-data.txt';
    // Только источники .ru. Данные справочника и экспорт в загрузки от этих запросов не зависят.
    const CURRENCY_API = 'https://www.cbr-xml-daily.ru/daily_json.js';
    const CURRENCY_JSONP = 'https://www.cbr-xml-daily.ru/daily_jsonp.js';
    const RATE_API = 'https://kurs-rublya.ru/api/v1/key-rates/cbr/';
    const LIVE_REFRESH_MS = 60 * 60 * 1000;
    const LIVE_SOURCES = {
        currency: 'https://www.cbr.ru/currency_base/daily/',
        rate: 'https://www.cbr.ru/statistics/idkp_br/refinancing_rates1/',
        nizhnekamsk: 'https://rp5.ru/5770/ru',
        moscow: 'https://rp5.ru/5483/ru'
    };
    const CURRENCY_CODES = ['USD', 'EUR', 'CNY'];
    const liveState = {};
    // Датированный снимок используется только в день проверки; устаревшую ставку не выдаём за текущую.
    const RATE_SNAPSHOT = { value: '14,00 %', day: '2026-09-24' };
    let liveRefreshPending = false;
    let lastLiveRefresh = 0;
    
    const isSharePoint = (() => {
        if (typeof window._spPageContextInfo !== 'undefined') return true;
        const url = window.location.href.toLowerCase();
        if (url.includes('sharepoint') || url.includes('_layouts') || url.includes('sites/')) return true;
        return false;
    })();
    
    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let menuItems = [];
    let subsections = {};
    let contentData = {};
    let originalMenu = [];
    let originalSubs = {};
    let originalContent = {};
    let isEditMode = false;
    let activeSection = null;
    let activeSub = null;
    let editingSection = null;
    let editingSubParent = null;
    let editingSubId = null;
    
    // Список иконок: класс FontAwesome + название на русском
    const iconList = [
        { class: "fas fa-folder", name: "Папка" },
        { class: "fas fa-folder-open", name: "Открытая папка" },
        { class: "fas fa-chart-line", name: "График" },
        { class: "fas fa-chart-bar", name: "Диаграмма" },
        { class: "fas fa-chart-pie", name: "Круговая диаграмма" },
        { class: "fas fa-money-bill-wave", name: "Деньги" },
        { class: "fas fa-calculator", name: "Калькулятор" },
        { class: "fas fa-tags", name: "Теги" },
        { class: "fas fa-database", name: "База данных" },
        { class: "fas fa-gavel", name: "Молоток" },
        { class: "fas fa-file-contract", name: "Договор" },
        { class: "fas fa-users", name: "Пользователи" },
        { class: "fas fa-book", name: "Книга" },
        { class: "fas fa-project-diagram", name: "Диаграмма проекта" },
        { class: "fas fa-hand-holding-usd", name: "Рука с деньгами" },
        { class: "fas fa-file-invoice-dollar", name: "Счет-фактура" },
        { class: "fas fa-clipboard-list", name: "Список" },
        { class: "fas fa-chalkboard-user", name: "Доска" },
        { class: "fas fa-link", name: "Ссылка" },
        { class: "fas fa-envelope", name: "Почта" },
        { class: "fas fa-cloud-upload-alt", name: "Облако" },
        { class: "fas fa-star", name: "Звезда" },
        { class: "fas fa-heart", name: "Сердце" },
        { class: "fas fa-cog", name: "Настройки" }
    ];
    
    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function showToast(msg, isError = false) {
        let existing = document.querySelector('.toast');
        if (existing) existing.remove();
        let toast = document.createElement('div');
        toast.className = 'toast' + (isError ? ' error' : '');
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    
    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function safeLink(value) {
        try {
            const raw = String(value || '').trim();
            // Внутренние UNC- и файловые пути остаются доступными для копирования.
            if (/^(?:\\\\|[a-z]:[\\/]|file:)/i.test(raw) || raw === '#') return '';
            const url = new URL(raw, window.location.href);
            return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
        } catch (_) { return ''; }
    }

    const safeIcon = value => iconList.some(item => item.class === value) ? value : 'fas fa-folder';

    const rubles = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const shortDate = date => /^\d{4}-\d{2}-\d{2}$/.test(String(date || '')) ?
        `${date.slice(8, 10)}.${date.slice(5, 7)}.${date.slice(0, 4)}` : '';

    async function fetchJson(url) {
        const controller = new AbortController();
        let timeout;
        try {
            return await Promise.race([
                (async () => {
                    const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.json();
                })(),
                new Promise((_, reject) => { timeout = setTimeout(() => { controller.abort(); reject(new Error('Время ожидания источника истекло')); }, 12000); })
            ]);
        } finally { clearTimeout(timeout); }
    }

    function fetchCurrencyData() {
        // JSONP поддерживается поставщиком курсов и работает без разрешения CORS в SharePoint.
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            let settled = false;
            const finish = (error, data) => {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                script.remove();
                delete window.CBR_XML_Daily_Ru;
                error ? reject(error) : resolve(data);
            };
            const timer = setTimeout(() => finish(new Error('Таймаут курсов')), 12000);
            window.CBR_XML_Daily_Ru = data => finish(null, data);
            script.onerror = () => finish(new Error('Курсы недоступны'));
            script.src = `${CURRENCY_JSONP}?t=${Date.now()}`;
            document.head.appendChild(script);
        }).catch(() => fetchJson(CURRENCY_API));
    }

    function parseRate(payload) {
        const raw = payload?.ratePercent ?? payload?.currentRate?.ratePercent ?? payload?.current?.ratePercent ??
            payload?.rate ?? payload?.currentRate?.rate ?? payload?.current?.rate;
        const value = typeof raw === 'string' ? Number(raw.replace(',', '.')) : Number(raw);
        const date = payload?.effectiveDate ?? payload?.currentRate?.effectiveDate ?? payload?.current?.effectiveDate ?? payload?.dateIso ?? payload?.date;
        if (!Number.isFinite(value) || value <= 0 || value >= 100) throw new Error('Неверный формат ставки');
        return { value: `${new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value)} %`,
            meta: `Данные ЦБ${shortDate(String(date || '').slice(0, 10)) ? ` · с ${shortDate(String(date).slice(0, 10))}` : ''}` };
    }

    function renderLiveCards() {
        // Инициализируем компактные карточки один раз, затем обновляем значения.
        const grid = document.getElementById('liveGrid');
        if (!grid.children.length) grid.innerHTML = `
            <article class="live-card"><div class="live-card-top"><i class="fas fa-coins"></i> Курсы ЦБ · ₽ за 1 <a href="https://www.cbr-xml-daily.ru/" target="_blank" rel="noopener noreferrer" title="Поставщик данных">Курсы валют, API ↗</a></div><div class="live-currencies" id="liveCurrencies"></div></article>
            <article class="live-card"><div class="live-card-top"><i class="fas fa-percent"></i> Ставка рефинансирования <a href="https://kurs-rublya.ru/kluchevaya-stavka/cbr/" target="_blank" rel="noopener noreferrer" title="Поставщик данных">источник ↗</a></div>
                <div id="liveRate"></div></article>
            <article class="live-card"><div class="live-card-top"><i class="fas fa-cloud-sun"></i> Прогноз погоды · <a href="https://rp5.ru/" target="_blank" rel="noopener noreferrer">rp5.ru ↗</a></div>
                <div class="live-weather-widgets">
                    <div class="live-weather-place"><a href="https://rp5.ru/5770/ru"><img border=0 width=120 height=60 src="https://rp5.ru/informer/120x60x2.php?f=16&id=5770&lang=ru&um=00000"></a></div>
                    <div class="live-weather-place"><a href="https://rp5.ru/5483/ru"><img border=0 width=120 height=60 src="https://rp5.ru/informer/120x60x2.php?f=16&id=5483&lang=ru&um=00000"></a></div>
                </div></article>`;
        const container = document.getElementById('liveCurrencies');
        container.innerHTML = CURRENCY_CODES.map(code => {
            const item = liveState[code];
            const title = item ? `${code}: ${item.meta}${item.stale ? ' · обновление недоступно' : ''}` : `${code}: курс недоступен`;
            return `<a class="live-quote ${item?.stale ? 'live-stale' : ''}" href="${LIVE_SOURCES.currency}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(title)}"><small>${code}</small><span>${item ? escapeHtml(item.value) : '—'}</span></a>`;
        }).join('');
        const rate = liveState.rate;
        const moscowDate = new Intl.DateTimeFormat('en', { timeZone: 'Europe/Moscow', year: 'numeric', month: '2-digit', day: '2-digit' });
        const parts = Object.fromEntries(moscowDate.formatToParts(new Date()).map(part => [part.type, part.value]));
        const snapshotIsToday = `${parts.year}-${parts.month}-${parts.day}` === RATE_SNAPSHOT.day;
        const shown = rate || (snapshotIsToday ? { value: RATE_SNAPSHOT.value, meta: `На ${shortDate(RATE_SNAPSHOT.day)} · онлайн проверка недоступна`, stale: true } : null);
        document.getElementById('liveRate').innerHTML = `<a class="live-rate-link ${shown?.stale ? 'live-stale' : ''}" href="${LIVE_SOURCES.rate}" target="_blank" rel="noopener noreferrer" title="Ставка рефинансирования на сайте Банка России">${shown ? escapeHtml(shown.value) : 'Открыть ЦБ ↗'}</a>
            <div class="live-detail">${shown ? escapeHtml(shown.meta + (shown.stale && rate ? ' · проверить на ЦБ' : '')) : 'Онлайн проверка недоступна'}</div>`;
    }

    async function refreshLiveData() {
        if (liveRefreshPending || Date.now() - lastLiveRefresh < LIVE_REFRESH_MS) return;
        liveRefreshPending = true;
        lastLiveRefresh = Date.now();
        const status = document.getElementById('liveUpdated');
        status.textContent = 'Обновление…';
        try {
        const [currencyResult, rateResult] = await Promise.allSettled([fetchCurrencyData(), fetchJson(RATE_API)]);
        if (currencyResult.status === 'fulfilled') {
            const currency = currencyResult.value;
            let errors = 0;
            for (const code of CURRENCY_CODES) {
                const row = currency?.Valute?.[code];
                if (row && Number.isFinite(Number(row.Value)) && Number(row.Value) > 0 && Number(row.Nominal) > 0) {
                    liveState[code] = { value: `${rubles.format(Number(row.Value) / Number(row.Nominal))} ₽`,
                        meta: `Курс ЦБ на ${shortDate(String(currency.Date || '').slice(0, 10)) || 'дату публикации'}` };
                } else {
                    errors++;
                    if (liveState[code]) liveState[code].stale = true;
                }
            }
            if (errors) console.warn('Часть курсов отсутствует в ответе источника');
        } else {
            for (const code of CURRENCY_CODES) if (liveState[code]) liveState[code].stale = true;
            console.warn('Не удалось обновить курсы ЦБ:', currencyResult.reason);
        }
        try {
            if (rateResult.status === 'rejected') throw rateResult.reason;
            liveState.rate = parseRate(rateResult.value);
        } catch (error) {
            if (liveState.rate) liveState.rate.stale = true;
            console.warn('Не удалось обновить ставку ЦБ:', error);
        }
        const fxOk = currencyResult.status === 'fulfilled';
        const rateOk = rateResult.status === 'fulfilled' && liveState.rate && !liveState.rate.stale;
        const time = new Intl.DateTimeFormat('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' }).format(new Date());
        status.textContent = fxOk && rateOk ? `Проверено · ${time} МСК` : `Данные частично недоступны · ${time} МСК`;
        renderLiveCards();
        // Повторно запрашиваем готовые изображения прогноза при очередной проверке через час.
        document.querySelectorAll('.live-weather-place img').forEach(img => { img.src = img.getAttribute('src'); });
        } catch (error) {
            status.textContent = 'Показатели временно недоступны';
            console.warn('Не удалось обновить показатели:', error);
        } finally { liveRefreshPending = false; }
    }
    
    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
        // Закрываем все открытые кастомные селекты
        document.querySelectorAll('.custom-select.open').forEach(el => el.classList.remove('open'));
    }
    
    function showModal(id) {
        document.getElementById(id).classList.add('active');
    }
    
    // Кастомный выпадающий список с иконками
    function createCustomSelect(containerId, previewId, currentIcon, onChangeCallback) {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        container.innerHTML = '';
        const trigger = document.createElement('div');
        trigger.className = 'select-trigger';
        const selectedIcon = iconList.find(ic => ic.class === currentIcon) || iconList[0];
        trigger.innerHTML = `<i class="${selectedIcon.class}"></i><span>${selectedIcon.name}</span><i class="fas fa-chevron-down arrow"></i>`;
        
        const dropdown = document.createElement('div');
        dropdown.className = 'select-dropdown';
        
        iconList.forEach(icon => {
            const option = document.createElement('div');
            option.className = 'select-option';
            if (icon.class === currentIcon) option.classList.add('selected');
            option.innerHTML = `<i class="${icon.class}"></i><span>${icon.name}</span>`;
            option.onclick = (e) => {
                e.stopPropagation();
                // Обновляем триггер
                trigger.innerHTML = `<i class="${icon.class}"></i><span>${icon.name}</span><i class="fas fa-chevron-down arrow"></i>`;
                // Обновляем превью
                const preview = document.getElementById(previewId);
                if (preview) preview.innerHTML = `<i class="${icon.class}"></i>`;
                // Закрываем дропдаун
                container.classList.remove('open');
                // Вызываем колбек
                if (onChangeCallback) onChangeCallback(icon.class);
                // Обновляем выбранный класс у опций
                dropdown.querySelectorAll('.select-option').forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
            };
            dropdown.appendChild(option);
        });
        
        container.appendChild(trigger);
        container.appendChild(dropdown);
        
        // Клик по триггеру
        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            // Закрываем другие открытые селекты
            document.querySelectorAll('.custom-select.open').forEach(el => {
                if (el !== container) el.classList.remove('open');
            });
            container.classList.toggle('open');
        });
        
        // Закрытие при клике вне
        document.addEventListener('click', () => {
            container.classList.remove('open');
        });
        
        return selectedIcon.class;
    }
    
    function getSelectedIconValue(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return 'fas fa-folder';
        const trigger = container.querySelector('.select-trigger i');
        if (trigger) {
            // Извлекаем класс иконки
            const classes = trigger.className.split(' ');
            return classes.find(c => c.startsWith('fa-')) ? trigger.className : 'fas fa-folder';
        }
        return 'fas fa-folder';
    }
    
    // Копирование в буфер обмена
    function copyToClipboard(text) {
        if (!text) return;
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        textarea.setSelectionRange(0, 99999);
        try {
            document.execCommand('copy');
            let displayText = text.length > 60 ? text.substring(0, 60) + '...' : text;
            showToast('✅ Скопировано: ' + displayText);
        } catch (err) {
            showToast('❌ Не удалось скопировать', true);
        }
        document.body.removeChild(textarea);
    }
    
    window.copyLink = function(link) {
        copyToClipboard(link);
    };
    
    // ========== РАБОТА С ДАННЫМИ ==========
    function loadFromJSON(data) {
        menuItems = JSON.parse(JSON.stringify(data.menuItems || []));
        subsections = JSON.parse(JSON.stringify(data.subsections || {}));
        contentData = JSON.parse(JSON.stringify(data.contentData || {}));
        for (let item of menuItems) {
            if (!subsections[item.id]) subsections[item.id] = [];
            if (subsections[item.id].length === 0) {
                let defaultSubId = item.id + '_main';
                subsections[item.id].push({ id: defaultSubId, name: "Основное", icon: "fas fa-folder-open" });
                if (!contentData[defaultSubId]) contentData[defaultSubId] = [];
            }
        }
    }
    
    async function loadFromSharePoint() {
        const controller = new AbortController();
        let timeout;
        try {
            let url = DATA_PATH + '?t=' + Date.now();
            let text = await Promise.race([
                (async () => {
                    const resp = await fetch(url, { headers: { 'Accept': 'text/plain' }, cache: 'no-store', signal: controller.signal });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    return resp.text();
                })(),
                new Promise((_, reject) => { timeout = setTimeout(() => { controller.abort(); reject(new Error('Время ожидания файла данных истекло')); }, 10000); })
            ]);
            let json = JSON.parse(text);
            loadFromJSON(json);
            originalMenu = JSON.parse(JSON.stringify(menuItems));
            originalSubs = JSON.parse(JSON.stringify(subsections));
            originalContent = JSON.parse(JSON.stringify(contentData));
            return true;
        } catch(e) {
            console.error('Ошибка загрузки:', e);
            return false;
        } finally { clearTimeout(timeout); }
    }
    
    // Сохранение выполняется только через скачивание файла пользователем.
    function saveToDownloads() {
        const exportData = { menuItems, subsections, contentData };
        const jsonStr = JSON.stringify(exportData, null, 2);
        const blob = new Blob([jsonStr], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = 'bifk-data.txt';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('✅ Данные сохранены в файл bifk-data.txt (папка Загрузки)');
    }
    
    // ========== ОТОБРАЖЕНИЕ ==========
    function renderMenu() {
        let container = document.getElementById('navMenu');
        if (!menuItems.length) { container.innerHTML = '<li class="info-message">Нет разделов</li>'; return; }
        let html = '';
        menuItems.forEach(item => {
            html += `<li><a href="#" data-section="${escapeHtml(item.id)}" class="${activeSection === item.id ? 'active' : ''}"><i class="${safeIcon(item.icon)}"></i><span>${escapeHtml(item.name)}</span></a>`;
            if (isEditMode) html += `<div class="menu-actions"><button class="edit-menu-btn" data-action="edit-section" data-section="${escapeHtml(item.id)}"><i class="fas fa-edit"></i> Ред.</button><button class="delete-menu-btn" data-action="delete-section" data-section="${escapeHtml(item.id)}"><i class="fas fa-trash"></i> Уд.</button></div>`;
            html += `</li>`;
        });
        container.innerHTML = html;
        document.querySelectorAll('.nav-premium a[data-section]').forEach(link => link.addEventListener('click', (e) => { e.preventDefault(); activateSection(link.dataset.section); }));
    }
    
    function renderContent() {
        let container = document.getElementById('contentArea');
        if (!menuItems.length) { container.innerHTML = '<div class="info-message"><h2>Рабочий справочник не подключён</h2><p>Документы и ссылки загружаются из файла bifk-data.txt на SharePoint. Эта страница позволяет посмотреть текущий интерфейс приложения.</p></div>'; return; }
        let html = '';
        for (let section of menuItems) {
            let subs = subsections[section.id] || [];
            let activeSubId = activeSub && subs.find(s => s.id === activeSub) ? activeSub : (subs[0]?.id);
            let pills = '<div class="quick-links-premium">';
            subs.forEach(sub => { pills += `<a href="#" data-section="${escapeHtml(section.id)}" data-sub="${escapeHtml(sub.id)}" class="pill-premium ${activeSubId === sub.id ? 'active' : ''}"><i class="${safeIcon(sub.icon)}"></i> ${escapeHtml(sub.name)}</a>`; });
            if (isEditMode) pills += `<button class="add-subsection-btn" data-action="add-subsection" data-section="${escapeHtml(section.id)}"><i class="fas fa-plus"></i> Добавить подраздел</button>`;
            pills += '</div>';
            let subsHtml = '';
            for (let sub of subs) {
                let rows = contentData[sub.id] || [];
                let display = activeSubId === sub.id ? 'block' : 'none';
                let tableRows = '';
                if (isEditMode) {
                    tableRows = rows.map((row, idx) => `<tr class="edit-mode-row"><td><input type="text" class="edit-input" data-sub="${escapeHtml(sub.id)}" data-row="${idx}" data-field="name" value="${escapeHtml(row[0])}"></td><td><input type="text" class="edit-input" data-sub="${escapeHtml(sub.id)}" data-row="${idx}" data-field="link" value="${escapeHtml(row[1])}"></td><td><input type="text" class="edit-input" data-sub="${escapeHtml(sub.id)}" data-row="${idx}" data-field="desc" value="${escapeHtml(row[2])}"></td><td><select class="edit-select" data-sub="${escapeHtml(sub.id)}" data-row="${idx}" data-field="status"><option ${row[3]==='Активно'?'selected':''}>Активно</option><option ${row[3]==='Отсутствует'?'selected':''}>Отсутствует</option><option ${row[3]==='Остановлено'?'selected':''}>Остановлено</option></select></td><td><div class="row-actions"><button data-action="move-up" data-sub="${escapeHtml(sub.id)}" data-row="${idx}" class="row-action-icon up" aria-label="Поднять строку"><i class="fas fa-arrow-up"></i></button><button data-action="move-down" data-sub="${escapeHtml(sub.id)}" data-row="${idx}" class="row-action-icon down" aria-label="Опустить строку"><i class="fas fa-arrow-down"></i></button><button data-action="delete-row" data-sub="${escapeHtml(sub.id)}" data-row="${idx}" class="row-action-icon delete" aria-label="Удалить строку"><i class="fas fa-trash"></i></button></div></td></tr>`).join('');
                    tableRows += `<tr><td colspan="5"><button data-action="add-row" data-sub="${escapeHtml(sub.id)}" class="add-row-btn"><i class="fas fa-plus"></i> Добавить строку</button></td></tr>`;
                } else {
                    tableRows = rows.map(row => {
                        const link = safeLink(row[1]);
                        const title = link ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer"><i class="fas fa-link"></i> ${escapeHtml(row[0])}</a>` : `<span>${escapeHtml(row[0])}</span>`;
                        return `<tr><td><div class="link-wrapper">${title}${row[1] ? `<button class="copy-link-btn" data-copy="${escapeHtml(row[1])}" aria-label="Скопировать ссылку"><i class="fas fa-copy"></i></button>` : ''}</div></td><td>${escapeHtml(row[2])}</td><td><span class="badge-premium">${escapeHtml(row[3] || 'Активно')}</span></td></tr>`;
                    }).join('');
                }
                subsHtml += `<div id="sub_${escapeHtml(sub.id)}" data-parent="${escapeHtml(section.id)}" style="display:${display}"><div class="clearfix"><h3 style="display:inline-flex; gap:10px;"><i class="${safeIcon(sub.icon)}"></i> ${escapeHtml(sub.name)}</h3>${isEditMode?`<div class="subsection-actions"><button data-action="edit-subsection" data-section="${escapeHtml(section.id)}" data-sub="${escapeHtml(sub.id)}" class="subsection-action-btn edit">Ред.</button><button data-action="delete-subsection" data-section="${escapeHtml(section.id)}" data-sub="${escapeHtml(sub.id)}" class="subsection-action-btn delete">Уд.</button></div>`:''}</div><table class="table-premium"><thead><tr><th>Наименование</th><th>Описание</th><th>Статус</th>${isEditMode?'<th>Действия</th>':''}</tr></thead><tbody>${tableRows}</tbody></table></div>`;
            }
            html += `<div id="section_${escapeHtml(section.id)}" class="content-section ${activeSection === section.id ? 'active' : ''}"><h2><i class="${safeIcon(section.icon)}"></i> ${escapeHtml(section.name)}</h2>${pills}${subsHtml}</div>`;
        }
        container.innerHTML = html;
        document.querySelectorAll('.pill-premium').forEach(pill => pill.addEventListener('click', (e) => { e.preventDefault(); activateSubsection(pill.dataset.section, pill.dataset.sub); }));
        if (isEditMode) document.querySelectorAll('.edit-input, .edit-select').forEach(inp => inp.addEventListener('change', function() { let row = contentData[this.dataset.sub]?.[parseInt(this.dataset.row)]; if(row) row[this.dataset.field === 'name'?0:this.dataset.field === 'link'?1:this.dataset.field === 'desc'?2:3] = this.value; }));
        if (document.getElementById('searchInput').value.trim()) renderSearchResults();
    }

    function renderSearchResults() {
        const query = document.getElementById('searchInput').value.trim().toLocaleLowerCase('ru-RU');
        if (!query || isEditMode) return;
        const matches = [];
        for (const section of menuItems) for (const sub of (subsections[section.id] || [])) {
            for (const row of (contentData[sub.id] || [])) {
                const haystack = [section.name, sub.name, row[0], row[2], row[3]].join(' ').toLocaleLowerCase('ru-RU');
                if (haystack.includes(query)) matches.push({ section, sub, row });
            }
        }
        const content = document.getElementById('contentArea');
        content.innerHTML = `<h2>Результаты поиска</h2><p class="live-meta">Найдено: ${matches.length}</p>` +
            (matches.length ? `<div class="search-results">${matches.map(x => `<button class="search-result" data-section="${escapeHtml(x.section.id)}" data-sub="${escapeHtml(x.sub.id)}"><strong>${escapeHtml(x.row[0])}</strong><small>${escapeHtml(x.section.name)} · ${escapeHtml(x.sub.name)}</small><span>${escapeHtml(x.row[2])}</span></button>`).join('')}</div>` : '<div class="info-message">Попробуйте другой запрос.</div>');
        content.querySelectorAll('.search-result').forEach(button => button.addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            activateSection(button.dataset.section);
            activateSubsection(button.dataset.section, button.dataset.sub);
        }));
    }
    
    function activateSection(sectionId) { activeSection = sectionId; activeSub = (subsections[sectionId] || [])[0]?.id; renderMenu(); renderContent(); }
    function activateSubsection(sectionId, subId) { activeSub = subId; renderContent(); }
    
    window.moveRowUp = (subId, idx) => { if(idx>0) { let rows = contentData[subId]; [rows[idx-1], rows[idx]] = [rows[idx], rows[idx-1]]; renderContent(); } };
    window.moveRowDown = (subId, idx) => { let rows = contentData[subId]; if(idx<rows.length-1) { [rows[idx+1], rows[idx]] = [rows[idx], rows[idx+1]]; renderContent(); } };
    window.deleteRow = (subId, idx) => { if(confirm('Удалить?')) { contentData[subId].splice(idx,1); renderContent(); } };
    window.addRow = (subId) => { contentData[subId] = contentData[subId] || []; contentData[subId].push(['Новая запись','','','Активно']); renderContent(); };
    window.deleteSection = (id) => { if(confirm('Удалить раздел?')) { (subsections[id] || []).forEach(s => delete contentData[s.id]); menuItems = menuItems.filter(s=>s.id!==id); delete subsections[id]; renderMenu(); renderContent(); if(menuItems.length) activateSection(menuItems[0].id); } };
    window.deleteSubsection = (sectionId, subId) => { if(confirm('Удалить подраздел?')) { subsections[sectionId] = subsections[sectionId].filter(s=>s.id!==subId); delete contentData[subId]; renderContent(); } };
    
    window.openEditSection = (id, name, icon) => { editingSection = id; document.getElementById('sectionNameInput').value = name; createCustomSelect('sectionIconSelect', 'sectionIconPreview', icon, (val) => {}); showModal('sectionModal'); };
    window.openAddSubsection = (sectionId) => { editingSubParent = sectionId; editingSubId = null; document.getElementById('subsectionNameInput').value = ''; createCustomSelect('subsectionIconSelect', 'subsectionIconPreview', 'fas fa-folder-open', (val)=>{}); showModal('subsectionModal'); };
    window.openEditSubsection = (sectionId, subId, name, icon) => { editingSubParent = sectionId; editingSubId = subId; document.getElementById('subsectionNameInput').value = name; createCustomSelect('subsectionIconSelect', 'subsectionIconPreview', icon, (val)=>{}); showModal('subsectionModal'); };
    
    function enableEditMode() { isEditMode = true; document.getElementById('editPanel').classList.add('active'); document.getElementById('editBtn').classList.add('edit-active'); document.getElementById('editBtn').innerHTML = '<i class="fas fa-times"></i> Выйти'; document.getElementById('addSectionBtn').classList.remove('hidden'); renderMenu(); renderContent(); showToast('Режим редактирования включён'); }
    function disableEditMode(cancel=false) { if(cancel) { menuItems = JSON.parse(JSON.stringify(originalMenu)); subsections = JSON.parse(JSON.stringify(originalSubs)); contentData = JSON.parse(JSON.stringify(originalContent)); showToast('Изменения отменены'); } isEditMode = false; document.getElementById('editPanel').classList.remove('active'); document.getElementById('editBtn').classList.remove('edit-active'); document.getElementById('editBtn').innerHTML = '<i class="fas fa-pen"></i> Режим редактирования'; document.getElementById('addSectionBtn').classList.add('hidden'); renderMenu(); renderContent(); if(activeSection) activateSection(activeSection); }
    
    // Кнопка сохранения запускает скачивание текстового файла.
    async function saveChanges() {
        saveToDownloads();
    }
    
    async function init() {
        renderLiveCards();
        refreshLiveData();
        setInterval(() => { if (document.visibilityState !== 'hidden') refreshLiveData(); }, LIVE_REFRESH_MS);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshLiveData(); });
        window.addEventListener('online', refreshLiveData);
        let loaded = await loadFromSharePoint();
        if (!loaded) {
            document.getElementById('navMenu').innerHTML = '<li class="info-message">Данные недоступны</li>';
            document.getElementById('contentArea').innerHTML = `<div class="info-message"><h2>Не удалось загрузить справочник</h2><p>Проверьте доступ к <a href="${DATA_PATH}" target="_blank" rel="noopener noreferrer">файлу bifk-data.txt</a> и попробуйте ещё раз.</p><button type="button" id="retryDataBtn" class="refresh-premium">Повторить загрузку</button></div>`;
            document.getElementById('retryDataBtn').onclick = () => location.reload();
            document.getElementById('refreshBtn').onclick = () => location.reload();
            document.getElementById('editBtn').disabled = true;
            return;
        }
        if(!loaded || menuItems.length===0) {
            menuItems = [];
            subsections = {};
            contentData = {};
        }
        renderMenu(); renderContent();
        if(menuItems.length) activateSection(menuItems[0].id);
        document.getElementById('refreshBtn').onclick = async () => { location.reload(); };
        document.getElementById('searchInput').addEventListener('input', () => {
            if (isEditMode) return;
            if (document.getElementById('searchInput').value.trim()) renderSearchResults();
            else renderContent();
        });
    }

    document.getElementById('contentArea').addEventListener('click', event => {
        const button = event.target.closest('button[data-copy]');
        if (button) copyToClipboard(button.dataset.copy);
    });
    document.addEventListener('click', event => {
        const button = event.target.closest('button[data-action]');
        if (!button || !isEditMode) return;
        const { action, section, sub, row } = button.dataset;
        const sectionData = menuItems.find(item => item.id === section);
        const subData = (subsections[section] || []).find(item => item.id === sub);
        if (action === 'edit-section' && sectionData) openEditSection(section, sectionData.name, sectionData.icon);
        if (action === 'delete-section' && sectionData) deleteSection(section);
        if (action === 'add-subsection' && sectionData) openAddSubsection(section);
        if (action === 'edit-subsection' && subData) openEditSubsection(section, sub, subData.name, subData.icon);
        if (action === 'delete-subsection' && subData) deleteSubsection(section, sub);
        if (action === 'move-up') moveRowUp(sub, Number(row));
        if (action === 'move-down') moveRowDown(sub, Number(row));
        if (action === 'delete-row') deleteRow(sub, Number(row));
        if (action === 'add-row') addRow(sub);
    });
    
    document.getElementById('editBtn').onclick = () => isEditMode ? disableEditMode(true) : (confirm('Включить редактирование?') && enableEditMode());
    document.getElementById('saveBtn').onclick = saveChanges;
    document.getElementById('cancelBtn').onclick = () => disableEditMode(true);
    document.getElementById('addSectionBtn').onclick = () => { if(!isEditMode) { alert('Включите режим редактирования'); return; } editingSection = null; document.getElementById('sectionNameInput').value = ''; createCustomSelect('sectionIconSelect', 'sectionIconPreview', 'fas fa-folder', ()=>{}); showModal('sectionModal'); };
    document.getElementById('saveSectionConfirm').onclick = () => {
        let name = document.getElementById('sectionNameInput').value.trim();
        if(!name) { alert('Введите название'); return; }
        let icon = getSelectedIconValue('sectionIconSelect');
        if(editingSection) { let idx = menuItems.findIndex(s=>s.id===editingSection); if(idx!==-1) { menuItems[idx].name = name; menuItems[idx].icon = icon; } editingSection = null; }
        else { let newId = 'section_'+Date.now(); menuItems.push({ id:newId, name:name, icon:icon }); let defaultSubId = newId+'_main'; subsections[newId] = [{ id:defaultSubId, name:'Основное', icon:'fas fa-folder-open' }]; if(!contentData[defaultSubId]) contentData[defaultSubId]=[]; }
        closeModal('sectionModal'); renderMenu(); renderContent(); if(menuItems.length) activateSection(menuItems[menuItems.length-1].id);
    };
    document.getElementById('saveSubsectionConfirm').onclick = () => {
        let name = document.getElementById('subsectionNameInput').value.trim();
        if(!name) { alert('Введите название'); return; }
        let icon = getSelectedIconValue('subsectionIconSelect');
        if(editingSubId && editingSubParent) { let subs = subsections[editingSubParent] || []; let idx = subs.findIndex(s=>s.id===editingSubId); if(idx!==-1) { subs[idx].name = name; subs[idx].icon = icon; } }
        else if(editingSubParent) { let newId = editingSubParent+'_sub_'+Date.now(); subsections[editingSubParent] = subsections[editingSubParent] || []; subsections[editingSubParent].push({ id:newId, name:name, icon:icon }); if(!contentData[newId]) contentData[newId]=[]; }
        closeModal('subsectionModal'); renderContent();
    };
    document.getElementById('mobileToggle').onclick = () => document.getElementById('sidebar').classList.toggle('mobile-open');
    window.onscroll = () => document.getElementById('scrollTop').classList.toggle('show', window.scrollY > 300);
    document.getElementById('scrollTop').onclick = () => window.scrollTo({ top:0, behavior:'smooth' });
    init();
</script>
</body>
</html>
